# Ollama for dev-cli — GPU-accelerated local LLM
# Usage:  docker compose up -d
# CPU:    docker compose --profile cpu up -d (or remove deploy section)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    tty: true
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${OLLAMA_MODELS_PATH:-ollama_data}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - dev-cli-net

  ollama-model-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    command: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-smallthinker}"]
    networks:
      - dev-cli-net

volumes:
  ollama_data:

networks:
  dev-cli-net:
    name: dev-cli-net
    driver: bridge
